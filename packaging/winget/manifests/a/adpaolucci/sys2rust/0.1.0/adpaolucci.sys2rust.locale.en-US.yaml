ShortDescription: 48-tool Windows process/ETW, hardware/SMBIOS/ACPI, shell/registry, and pure-Rust PE/.NET inspection suite with dual GUIs, CLI, and MCP server.
Description: >-
  sys2rust is a 48-tool Windows system, hardware, shell, and PE32/PE32+/.NET inspection suite
  built in Rust (Edition 2024) on guap-kit. It covers process/thread/handle/ETW monitoring
  without DLL injection, services/drivers/devices/Task Scheduler/WMI/SMBIOS/ACPI/battery/codecs/timezones,
  shell/startup/MSI/Appx/COM/DesktopOK/TrayNotify/CleanAfterMe audit, and pure-Rust PE/.NET extraction,
  with dual Win32 (WinSafe) & Iced 0.14 GUIs, 7-format exports with SHA-256/512 Merkle custody,
  and a read-only-default MCP JSON-RPC stdio server.
