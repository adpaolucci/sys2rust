[package]
name = "sys2rust-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "19 Windows shell, startup, uninstall, MSI/Appx, shell extension, file association, COM, DesktopOK, TrayNotify, and privacy audit tools"

[dependencies]
sys2rust-core.workspace = true
guap-table.workspace = true
guap-mcp.workspace = true
winreg.workspace = true
roxmltree.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tracing.workspace = true
walkdir.workspace = true
dirs.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_ApplicationInstallationAndServicing",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Environment",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "ApplicationModel",
    "Foundation_Collections",
    "Management_Deployment",
    "Storage",
    "Storage_Search",
    "System",
] }

[dev-dependencies]
tempfile.workspace = true
